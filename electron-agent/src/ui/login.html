<!DOCTYPE html>
<html>

<head>
    <title>User Monitor Agent</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#de173f',
                        'primary-hover': '#c21437',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        outfit: ['Outfit', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        :root {
            --primary: #de173f;
            --primary-glow: rgba(222, 23, 63, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            background: #f1f5f9;
            color: #0f172a;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        /* Mesh Gradient Background (Light) */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 0% 0%, rgba(222, 23, 63, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(79, 70, 229, 0.05) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(222, 23, 63, 0.05) 0px, transparent 50%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(15, 23, 42, 0.08);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(15, 23, 42, 0.1);
            color: #0f172a;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 15px var(--primary-glow);
            outline: none;
        }

        .btn-glow-primary {
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(222, 23, 63, 0.3);
        }

        .btn-glow-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(222, 23, 63, 0.4);
        }

        .btn-glow-primary:active:not(:disabled) {
            transform: translateY(1px);
        }

        .timer-glow {
            text-shadow: 0 0 20px rgba(248, 250, 252, 0.2);
        }

        .status-pulse {
            position: relative;
        }

        .status-pulse::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: inherit;
            background: inherit;
            animation: pulse-ring 2s cubic-bezier(0.455, 0.03, 0.515, 0.955) infinite;
            z-index: -1;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            80%, 100% { transform: scale(2); opacity: 0; }
        }

        @keyframes tracking-pulse-anim {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

        .tracking-pulse {
            animation: tracking-pulse-anim 3s infinite ease-in-out;
        }

        /* Custom Dropdown Styles */
        .dropdown-menu {
            transform-origin: top;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        #campaignList, #breakList {
            margin: 0;
            padding: 4px 0;
            list-style: none;
            width: 100%;
        }

        .dropdown-item {
            width: 100%;
            padding: 10px 16px;
            font-size: 14px;
            text-align: left;
            color: #475569;
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            border-left: 2px solid transparent;
        }

        .dropdown-item:hover {
            background: rgba(15, 23, 42, 0.04);
            color: #0f172a;
        }

        .dropdown-item.selected {
            background: rgba(222, 23, 63, 0.08);
            color: #de173f;
            font-weight: 600;
            border-left: 2px solid #de173f;
        }

        /* Campaign Pill Styling */
        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 4px 12px;
            border-radius: 9999px;
            background: rgba(222, 23, 63, 0.1);
            border: 1px solid rgba(222, 23, 63, 0.2);
            color: #de173f;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
            line-height: 1;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
        }

        /* Draggable region for Electron */
        .drag-region {
            -webkit-app-region: drag;
        }
        .no-drag {
            -webkit-app-region: no-drag;
        }

        /* Frameless window: OS-style caption, minimize only (no close / no maximize) */
        .window-caption {
            height: 32px;
            flex-shrink: 0;
        }
        .caption-min-btn {
            width: 46px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            color: #334155;
            cursor: default;
            transition: background 0.12s ease;
        }
        .caption-min-btn:hover {
            background: rgba(15, 23, 42, 0.08);
        }
        .caption-min-btn:active {
            background: rgba(15, 23, 42, 0.14);
        }
        .caption-update-btn {
            min-width: 72px;
            height: 100%;
            padding: 0 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            border-right: 1px solid rgba(15, 23, 42, 0.12);
            background: transparent;
            color: #475569;
            cursor: default;
            transition: background 0.12s ease, color 0.12s ease;
        }
        .caption-update-btn:hover:not(:disabled) {
            background: rgba(222, 23, 63, 0.08);
            color: #de173f;
        }
        .caption-update-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }
        .caption-update-btn.ready {
            background: rgba(16, 185, 129, 0.15);
            color: #047857;
        }
        @keyframes caption-spin {
            to { transform: rotate(360deg); }
        }
        .caption-update-btn .spin-icon {
            animation: caption-spin 0.9s linear infinite;
        }
    </style>
</head>

<body>
    <div class="mesh-bg"></div>

    <div class="window-caption flex items-stretch bg-[#e2e8f0] border-b border-slate-300">
        <div class="drag-region flex flex-1 items-center min-w-0 px-3">
            <span class="text-xs font-semibold text-slate-600 truncate">User Monitor Agent</span>
        </div>
        <div class="no-drag flex items-stretch border-l border-slate-300">
            <button type="button" id="captionUpdateBtn" class="caption-update-btn" title="Check for updates">
                <i data-lucide="refresh-cw" id="captionUpdateIcon" class="w-3.5 h-3.5 flex-shrink-0"></i>
                <span id="captionUpdateLabel" class="text-[10px] font-semibold leading-none whitespace-nowrap">Update</span>
            </button>
            <button type="button" id="captionMinimizeBtn" class="caption-min-btn border-l border-slate-300" title="Minimize" aria-label="Minimize">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Header / Title Bar -->
    <header class="flex items-center justify-between px-5 py-4 bg-white/40 border-b border-slate-200 backdrop-blur-md">
        <div class="drag-region flex items-center gap-3 flex-1 min-w-0">
            <div class="p-1.5 bg-primary/10 rounded-lg">
                <i data-lucide="shield-check" class="text-primary w-5 h-5"></i>
            </div>
            <span class="font-outfit font-semibold text-sm tracking-tight text-slate-800">SCK <span class="text-primary">Agent</span></span>
        </div>
        <div class="flex items-center gap-2 no-drag">
            <div id="roleBadge" class="text-[10px] uppercase font-bold tracking-widest bg-slate-900/5 border border-slate-900/10 px-2.5 py-1 rounded-full text-slate-600">
                Standard User
            </div>
            <button id="logoutBtn" type="button" class="hidden p-2 hover:bg-red-500/10 text-slate-400 hover:text-red-500 rounded-lg transition-all" title="Sign Out">
                <i data-lucide="power" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 flex flex-col p-5 overflow-y-auto">
        <!-- Login View -->
        <div id="loginView" class="login-view w-full max-w-[320px] m-auto space-y-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-outfit font-bold text-slate-900 leading-tight">Welcome Back</h2>
                <p class="text-sm text-slate-500">Sign in to start your shift</p>
            </div>

            <form id="loginForm" class="space-y-5">
                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Work Email</label>
                    <div class="relative group">
                        <i data-lucide="mail" class="absolute left-3 top-3 w-4 h-4 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                        <input type="email" id="email" 
                            class="glass-input pl-10 pr-4 py-2.5 w-full rounded-xl text-sm placeholder:text-slate-600" 
                            placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Password</label>
                    <div class="relative group">
                        <i data-lucide="lock" class="absolute left-3 top-3 w-4 h-4 text-slate-400 group-focus-within:text-primary transition-colors"></i>
                        <input type="password" id="password" 
                            class="glass-input pl-10 pr-4 py-2.5 w-full rounded-xl text-sm placeholder:text-slate-400" 
                            placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" 
                    class="btn-glow-primary w-full py-3 bg-primary hover:bg-primary-hover text-white rounded-xl font-semibold text-sm flex items-center justify-center gap-2 transition-all">
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                    Sign In
                </button>

                <div id="errorMsg" class="hidden p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-xs text-center rounded-lg animate-pulse"></div>
            </form>
        </div>

        <!-- Tracking View -->
        <div id="trackingView" class="hidden flex-col gap-6 animate-in fade-in zoom-in-95 duration-500">
            <!-- Timer Card -->
            <div class="glass-card rounded-[2rem] p-8 text-center relative overflow-hidden group">
                <!-- Decorative Glow Behind Timer -->
                <div class="absolute inset-0 bg-primary/5 opacity-0 group-hover:opacity-100 transition-opacity duration-1000"></div>
                
                <div class="relative z-10 space-y-4">
                    <span class="text-[10px] uppercase font-bold tracking-[0.2em] text-slate-500">Shift Elapsed Time</span>
                    <h1 id="timerDisplay" class="timer-glow font-mono text-5xl font-semibold text-slate-900 tracking-tight">00:00:00</h1>
                    
                    <div class="flex flex-col items-center gap-2">
                        <div id="statusBadge" class="status-offline inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full border border-slate-200 transition-all duration-500">
                            <div class="status-dot w-2 h-2 rounded-full status-pulse bg-red-500"></div>
                            <span id="statusText" class="text-[11px] font-bold uppercase tracking-wider">Offline</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Actions -->
            <div id="startActions" class="flex flex-col gap-4">
                <!-- Campaign Selector -->
                <div id="campaignSection" class="hidden flex-col gap-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2 ml-1">
                        <i data-lucide="megaphone" class="w-3 h-3"></i> Select Assignment
                    </label>
                    <div class="relative w-full" id="campaignDropdown">
                        <button type="button" id="campaignTrigger" class="glass-input w-full p-3 rounded-xl text-sm flex items-center justify-between no-drag focus:ring-1 focus:ring-primary/50 group">
                            <span id="selectedCampaignText" class="text-slate-500">Choose a campaign...</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 group-focus:text-primary transition-colors"></i>
                        </button>
                        <div id="campaignMenu" class="hidden absolute top-full left-0 w-full mt-2 glass-card rounded-xl border border-white/10 overflow-hidden z-50 shadow-2xl animate-in fade-in slide-in-from-top-2 duration-200">
                            <ul id="campaignList" class="max-h-48 overflow-y-auto py-1">
                                <!-- Campaigns injected via JS -->
                            </ul>
                        </div>
                    </div>
                    <div id="campaignBadge" class="hidden"></div>
                </div>

                <button id="startShiftBtn" class="btn-glow-primary w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-bold flex items-center justify-center gap-3 transition-all">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    START SHIFT
                </button>
            </div>

            <div id="activeActions" class="hidden flex flex-col gap-4">
                <div class="space-y-2">
                    <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2 ml-1">
                        <i data-lucide="coffee" class="w-3 h-3"></i> Current Activity
                    </label>
                    <div class="relative w-full" id="breakDropdown">
                        <button type="button" id="breakTrigger" class="glass-input w-full p-3 rounded-xl text-sm flex items-center justify-between no-drag focus:ring-1 focus:ring-primary/50 group">
                            <span id="selectedBreakText" class="text-slate-500">Select Break Type</span>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 group-focus:text-amber-500 transition-colors"></i>
                        </button>
                        <div id="breakMenu" class="hidden absolute top-full left-0 w-full mt-2 glass-card rounded-xl border border-white/10 overflow-hidden z-50 shadow-2xl animate-in fade-in slide-in-from-top-2 duration-200">
                            <ul id="breakList" class="max-h-48 overflow-y-auto py-1">
                                <!-- Breaks injected via JS -->
                            </ul>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col gap-3">
                    <button id="breakBtn" class="py-5 bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/30 text-amber-500 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="coffee" class="w-4 h-4"></i>
                        Pause Break
                    </button>
                    <button id="endShiftBtn" class="py-5 bg-red-50 hover:bg-red-100 border border-red-200 text-red-600 rounded-xl font-bold text-sm flex items-center justify-center gap-2 transition-all">
                        <i data-lucide="square" class="w-4 h-4 fill-current"></i>
                        END SHIFT
                    </button>
                </div>
            </div>

            <!-- Break View -->
            <div id="breakActions" class="hidden flex-col items-center gap-6 p-6 glass-card rounded-2xl border-amber-500/10">
                <div class="text-center space-y-1">
                    <p class="text-xs font-semibold text-slate-500 uppercase tracking-widest">Resting Mode</p>
                    <h3 id="currentBreakType" class="text-lg font-bold text-amber-600"></h3>
                </div>
                <button id="resumeBtn" class="btn-glow-primary w-full py-4 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-bold flex items-center justify-center gap-3 transition-all scale-105">
                    <i data-lucide="play" class="w-5 h-5 fill-current"></i>
                    RESUME WORK
                </button>
            </div>

            </div>
        </div>
    </main>

    <footer class="px-5 py-4 bg-white/40 border-t border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2 group">
            <div class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-medium text-slate-500 group-hover:text-slate-700 transition-colors">© preqservices.com</span>
        </div>
        <div class="flex flex-col items-end">
            <span id="lastSyncText" class="text-[9px] font-bold text-slate-500 uppercase tracking-tighter italic">Never Synced</span>
            <span id="appVersionLabel" class="text-[8px] text-slate-600">—</span>
        </div>
    </footer>

    <script src="login.js"></script>
    <script>
        // Initial icon generation
        if (window.lucide) {
            lucide.createIcons();
        }
        
        // Custom hack for Lucide refresh if needed
        const originalLucideCreateIcons = lucide.createIcons;
        window.lucide.refresh = () => {
            originalLucideCreateIcons();
        }
    </script>
</body>

</html>
