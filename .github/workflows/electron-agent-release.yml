# Build Windows installers (NSIS + MSI) for User Monitor Agent and publish to GitHub Releases.
# Auto-update in the app uses the NSIS build + latest.yml (electron-updater).
#
# Trigger: push tag  agent-v1.2.3  → package version becomes 1.2.3 and assets attach to that release.
#
# Prerequisites: GitHub repo must match electron-agent/package.json publish (dreamconsole/user-monitor).

name: Electron Agent (Windows) Release

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver only, e.g. 1.2.0 (must match release intent)'
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: electron-agent/package-lock.json

      - name: Set package version
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_VER: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PKG_VERSION=${INPUT_VER}" >> "$GITHUB_ENV"
            echo "Dispatch version: ${INPUT_VER}"
          else
            TAG="${TAG_REF#refs/tags/agent-}"
            VER="${TAG#v}"
            echo "PKG_VERSION=$VER" >> "$GITHUB_ENV"
            echo "Tag version: $VER"
          fi

      - name: Apply version to package.json
        shell: bash
        run: npm pkg set "version=${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f

      - name: Build Windows installers and publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
