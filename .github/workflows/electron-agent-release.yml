# Build Windows installers (NSIS + MSI) for User Monitor Agent.
# CI uploads artifacts (no GitHub Releases publish). Host the NSIS `.exe` yourself and point the API server at it via AGENT_UPDATE_* env vars; agents poll GET /agent/update-info.
#
# Trigger: push tag  agent-v1.2.3  → package version becomes 1.2.3.

name: Electron Agent (Windows) Release

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver only, e.g. 1.2.0 (must match release intent)'
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: electron-agent/package-lock.json

      - name: Set package version
        shell: bash
        env:
          TAG_REF: ${{ github.ref }}
          INPUT_VER: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PKG_VERSION=${INPUT_VER}" >> "$GITHUB_ENV"
            echo "Dispatch version: ${INPUT_VER}"
          else
            TAG="${TAG_REF#refs/tags/agent-}"
            VER="${TAG#v}"
            echo "PKG_VERSION=$VER" >> "$GITHUB_ENV"
            echo "Tag version: $VER"
          fi

      - name: Apply version to package.json
        shell: bash
        run: npm pkg set "version=${PKG_VERSION}"

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild -f

      # NSIS + MSI on Windows (Linux dev builds use NSIS-only via npm run dist:win).
      - name: Build Windows installers (no publish)
        run: npx electron-builder --win nsis:x64 --win msi:x64 --publish never

      - name: Upload installers and metadata
        uses: actions/upload-artifact@v4
        with:
          name: windows-agent-${{ env.PKG_VERSION }}
          path: |
            electron-agent/dist/*.exe
            electron-agent/dist/latest.yml
