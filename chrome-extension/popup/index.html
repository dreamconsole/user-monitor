<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>User Monitor Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="header-left">
      <i data-lucide="shield-check" size="20"></i>
      <span class="app-name">User Monitor Agent</span>
    </div>
    <div class="user-role" id="role-badge">Standard User</div>
  </header>

  <main>
    <!-- Login View -->
    <div class="login-view card" id="login-view">
      <h2>Sign In</h2>
      <form id="login-form">
        <div class="form-group">
          <label>Work Email</label>
          <input type="email" id="email" placeholder="name@company.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="login-btn" class="btn-primary">
          <i data-lucide="log-in" size="18"></i>
          Login
        </button>
        <div id="login-error" class="error-overlay"></div>
      </form>
    </div>

    <!-- Tracking View -->
    <div class="tracking-view hidden" id="status-view">
      <div class="card timer-section">
        <div class="timer-label">Active Session Time</div>
        <h1 class="timer-display" id="timer-display">00:00:00</h1>

        <div id="status-badge" class="status-badge status-offline">
          <div class="status-dot" id="status-dot"></div>
          <span id="status-text">Offline</span>
        </div>
      </div>

      <div id="start-actions" class="btn-group">
        <button id="start-shift-btn" class="btn-success">
          <i data-lucide="play" size="18"></i>
          Start Shift
        </button>
      </div>

      <div id="active-actions" class="btn-group hidden">
        <div class="form-group" style="margin-bottom: 0;">
          <label>Current Activity</label>
          <select id="break-type">
            <option value="Lunch Break">Lunch Break</option>
            <option value="Tea Break">Tea Break</option>
            <option value="Meeting">Meeting</option>
            <option value="Personal">Personal</option>
          </select>
        </div>
        <button id="pause-btn" class="btn-warning">
          <i data-lucide="coffee" size="18"></i>
          Take Break
        </button>
        <button id="end-shift-btn" class="btn-error">
          <i data-lucide="square" size="18"></i>
          End Shift
        </button>
      </div>

      <div id="break-actions" class="btn-group hidden">
        <div style="text-align: center; margin-bottom: 12px;">
          <p style="color: var(--text-muted); font-size: 0.875rem; margin: 0;">On Break</p>
          <strong id="current-break-type" style="color: var(--warning);"></strong>
        </div>
        <button id="resume-btn" class="btn-success">
          <i data-lucide="play" size="18"></i>
          Resume Work
        </button>
      </div>

      <div id="user-info" style="font-size: 0.75rem; color: var(--text-muted); text-align: center; margin-top: 12px;">
      </div>
      <button id="logout-btn" class="btn-ghost" style="margin-top: 12px;">
        <i data-lucide="power" size="16"></i>
        Sign Out
      </button>
    </div>
  </main>

  <footer>
    <span id="version-text">v1.0.0</span>
    <span id="last-sync-text">Last Sync: Never</span>
  </footer>

  <script src="../config.js"></script>
  <script src="popup.js"></script>
</body>

</html>
